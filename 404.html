<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Not found — JS Spec</title>
    <script>
        // GitHub Pages paths are case-sensitive: send /Hub, /RADAR, /hub (no slash) and the like to /hub/ or /radar/.
        const door = location.pathname.match(/^\/(hub|radar)\/?$/i);
        if (door && location.pathname !== `/${door[1].toLowerCase()}/`) location.replace(`/${door[1].toLowerCase()}/`);
    </script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/modes.css">
</head>

        <span class="eyeline">JS Spec / 404</span>
        <h1>Wrong turn.</h1>
        <p class="lede">That page doesn't exist. <a href="/">Head back to the start</a>.</p>
    </main>
</body>
</html>
